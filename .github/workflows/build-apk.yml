name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get
        working-directory: score_lookup

      - name: Build APK
        run: flutter build apk --release --no-shrink
        working-directory: score_lookup

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: score_lookup/build/app/outputs/flutter-apk/lookup.apk
